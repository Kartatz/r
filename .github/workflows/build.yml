name: CI
on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@main
    - name: Start Arch Linux container
      run: |
        sudo docker run \
            --detach \
            --init \
            --privileged \
            --name 'archlinux' \
            --publish '127.0.0.1:30000:22/tcp' \
            archlinux:latest \
            sleep infinity
        
        sudo docker exec archlinux pacman --sync --refresh --sysupgrade --noconfirm
        
        sudo docker exec archlinux useradd --create-home --shell '/bin/bash' james
    - name: Install Unbound
      run: |
        sudo docker exec archlinux pacman --sync --refresh --noconfirm unbound
        sudo docker cp "${PWD}/unbound.conf" archlinux:/etc/unbound/unbound.conf
        sudo docker exec --detach archlinux unbound
        echo 'nameserver 127.0.0.1' | sudo docker exec --interactive archlinux tee '/etc/resolv.conf'
    - name: Install Python
      run: |
        sudo docker exec archlinux pacman --sync --refresh --noconfirm python python-pip
    - name: Install extra packages
      run: |
        sudo docker exec archlinux pacman --sync --refresh --noconfirm ripgrep git curl screen vim base-devel cmake gdb dejagnu jdk25-openjdk jq jadx tor torsocks wine-staging clang lld sudo aria2
    - name: Install zsh
      run: |
        sudo docker exec archlinux pacman --sync --refresh --noconfirm zsh
        
        sudo docker exec --user james --workdir '/home/james' archlinux bash -c 'sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended'
        
        sudo docker exec archlinux usermod --shell '/bin/zsh' james
        
        sudo docker exec archlinux rm --force '/etc/zsh/zshrc'
        
        sudo docker exec --user james --workdir '/home/james' archlinux bash -c 'echo "path+=${HOME}/.opencode/bin" >> ~/.zshrc'
        sudo docker exec --user james --workdir '/home/james' archlinux bash -c 'echo "path+=${HOME}/.local/bin" >> ~/.zshrc'
    - name: Change global settings
      run: |
        echo 'defscrollback 1000000' | sudo docker exec --interactive archlinux tee --append '/etc/screenrc'
        echo 'VISUAL=vim' | sudo docker exec --interactive archlinux tee --append '/etc/environment'
        echo 'EDITOR=vim' | sudo docker exec --interactive archlinux tee --append '/etc/environment'
        echo 'LC_ALL=C.UTF-8' | sudo docker exec --interactive archlinux tee --append '/etc/environment'
        echo 'ZSH_DISABLE_COMPFIX=true' | sudo docker exec --interactive archlinux tee --append '/etc/environment'
        
        sudo docker exec archlinux rm --force '/etc/motd'
    - name: Install OpenCode
      run: |
        curl -fsSL https://opencode.ai/install | sudo docker exec --interactive --user james archlinux bash
        printf '%s\n' '${{ secrets.OPENCODE_CONFIG }}' | sudo docker exec --interactive --user james archlinux bash -c 'mkdir -p "$HOME/.config/opencode"; cat > "$HOME/.config/opencode/opencode.jsonc"'
    - name: Set git credentials
      run: |
        sudo docker exec archlinux pacman --sync --refresh --noconfirm github-cli
        
        printf '%s\n' '${{ secrets.GH_TOKEN }}' | sudo docker exec --interactive --user james archlinux gh auth login --with-token
        sudo docker exec --user james archlinux gh auth setup-git
        
        sudo docker exec --user james archlinux git config --global user.email "105828205+Kartatz@users.noreply.github.com"
        sudo docker exec --user james archlinux git config --global user.name "Kartatz"
        sudo docker exec --user james archlinux git config --global pull.rebase true
    - name: Run
      env:
        SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        SSH_SERVER: ${{ secrets.SSH_SERVER }}
        SSH_KEY: ${{ secrets.SSH_KEY }}
        SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      run: |
        echo "${SSH_KEY}" > './id_rsa.b64'
        
        pwd
        
        base64 -d './id_rsa.b64' > './id_rsa'
        
        chmod 600 './id_rsa'
        
        sudo docker exec archlinux pacman --sync --noconfirm openssh
        sudo docker exec archlinux ssh-keygen -A
        
        echo "root:${SSH_PASSWORD}" | sudo docker exec --interactive archlinux chpasswd
        echo "james:${SSH_PASSWORD}" | sudo docker exec --interactive archlinux chpasswd
        
        sudo docker exec archlinux /usr/bin/sshd \
            -o 'StrictModes=no' \
            -o 'GatewayPorts=no' \
            -o 'ListenAddress=0.0.0.0' \
            -o 'Port=22' \
            -o 'PasswordAuthentication=yes' \
            -o 'PermitRootLogin=yes' \
            -o 'PermitEmptyPasswords=no' \
            -o 'ClientAliveInterval=5' \
            -o 'ClientAliveCountMax=3'
        
        while true; do
            ssh \
                -N \
                -q \
                -o 'UserKnownHostsFile=/dev/null' \
                -o 'StrictHostKeyChecking=no' \
                -o 'ServerAliveInterval=5' \
                -i './id_rsa' \
                -R '0.0.0.0:47080:127.0.0.1:30000' \
                "${SSH_USERNAME}@${SSH_SERVER}" || true
        done

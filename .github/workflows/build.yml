name: CI
on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@main
    - name: Install Unbound
      run: |
        sudo apt-get install --update --assume-yes unbound
        sudo cp "${PWD}/unbound.conf" '/etc/unbound/unbound.conf.d'
        sudo systemctl restart unbound.service
        echo 'nameserver 127.0.0.1' | sudo tee '/etc/resolv.conf'
    - name: Install Python
      uses: actions/setup-python@main
      with:
        python-version: '3.15-dev'
    - name: Install zsh
      run: |
        if [ "${RUNNER_OS}" = 'Linux' ]; then
            sudo apt-get install --update --assume-yes zsh ripgrep
        else
            brew install zsh ripgrep
        fi
        
        sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
        sudo chsh "${USER}" -s /bin/zsh
        
        sudo rm --force '/etc/zsh/zshrc'
        
        echo "path+=${HOME}/.opencode/bin" >> ~/.zshrc
        echo "path+=${HOME}/.local/bin" >> ~/.zshrc
        
        echo "path+=${ANDROID_HOME}/cmdline-tools/latest/bin" >> ~/.zshrc
        echo "path+=${ANDROID_HOME}/platform-tools" >> ~/.zshrc
    - name: Change global settings
      run: |
        echo 'defscrollback 1000000' | sudo tee -a '/etc/screenrc'
        echo 'VISUAL=vim' | sudo tee -a '/etc/environment'
        echo 'EDITOR=vim' | sudo tee -a '/etc/environment'
        echo 'LC_ALL=C.UTF-8' | sudo tee -a '/etc/environment'
        echo 'ZSH_DISABLE_COMPFIX=true' | sudo tee -a '/etc/environment'
        echo "JAVA_HOME=${JAVA_HOME_21_X64}" | sudo tee -a '/etc/environment'
        
        sudo rm --force  '/etc/motd'
    - name: Install OpenCode
      shell: zsh {0}
      run: |
        curl -fsSL https://opencode.ai/v2/install | bash
        mkdir ~/.config/opencode
        echo '${{ secrets.OPENCODE_CONFIG }}' > ~/.config/opencode/opencode.jsonc
    - name: Set git credentials
      run: |
        gh auth login --with-token <<< '${{ secrets.GH_TOKEN }}'
        gh auth setup-git
        
        git config --global user.email "105828205+Kartatz@users.noreply.github.com"
        git config --global user.name "Kartatz"
    - name: Run
      env: 
        SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        SSH_SERVER: ${{ secrets.SSH_SERVER }}
        SSH_KEY: ${{ secrets.SSH_KEY }}
        SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      run: |
        echo "${SSH_KEY}" > './id_rsa.b64'
        
        pwd
        
        if [ "${RUNNER_OS}" = 'Linux' ]; then
            base64 -d './id_rsa.b64' > './id_rsa'
        else
            base64 --decode --input './id_rsa.b64' --output './id_rsa'
        fi
        
        chmod 600 './id_rsa'
        
        sudo ssh-keygen -A
        
        sudo mkdir --parent '/var/run/sshd'
        sudo chmod 0755 '/var/run/sshd'
        
        if [ "${RUNNER_OS}" = 'Linux' ]; then
            echo -e "${SSH_PASSWORD}\n${SSH_PASSWORD}\n" | sudo passwd
            echo -e "${SSH_PASSWORD}\n${SSH_PASSWORD}\n" | sudo passwd runner
        else
            sudo dscl . -passwd '/Users/root' "${SSH_PASSWORD}"
        fi
        
        sudo /usr/sbin/sshd \
            -o 'StrictModes=no' \
            -o 'GatewayPorts=no' \
            -o 'ListenAddress=127.0.0.1' \
            -o 'Port=30000' \
            -o 'PasswordAuthentication=yes' \
            -o 'PermitRootLogin=yes' \
            -o 'PermitEmptyPasswords=no' \
            -o 'ClientAliveInterval=5' \
            -o 'ClientAliveCountMax=3'
                
        while true; do
            ssh \
                -N \
                -q \
                -o 'UserKnownHostsFile=/dev/null' \
                -o 'StrictHostKeyChecking=no' \
                -o 'ServerAliveInterval=5' \
                -i './id_rsa' \
                -R '127.0.0.1:30000:127.0.0.1:30000' \
                "${SSH_USERNAME}@${SSH_SERVER}" || true
        done



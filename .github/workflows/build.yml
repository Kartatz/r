name: CI
on:
  workflow_dispatch:

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 355
    steps:
    - uses: actions/checkout@main
    - name: Set deadline
      run: echo "DEADLINE=$(($(date +%s) + 20400))" >> "$GITHUB_ENV"
    - name: Start Arch Linux container
      run: |
        sudo docker run \
            --detach \
            --privileged \
            --name 'archlinux' \
            --publish '127.0.0.1:30000:22/tcp' \
            --publish '127.0.0.1:1080:1080/tcp' \
            --publish '127.0.0.1:4000:4000/tcp' \
            archlinux:latest \
            /sbin/init
        
        sudo docker exec archlinux pacman --sync --refresh --sysupgrade --noconfirm
        
        sudo docker exec archlinux useradd --create-home --shell '/bin/bash' james
    - name: Install Unbound
      run: |
        sudo docker exec archlinux pacman --sync --refresh --noconfirm unbound
        sudo docker cp "${PWD}/unbound.conf" archlinux:/etc/unbound/unbound.conf
        sudo docker exec archlinux systemctl enable --now unbound.service
        echo 'nameserver 127.0.0.1' | sudo docker exec --interactive archlinux tee '/etc/resolv.conf'
    - name: Install Python
      run: |
        sudo docker exec archlinux pacman --sync --refresh --noconfirm python python-pip
    - name: Install extra packages
      run: |
        sudo docker exec archlinux pacman --sync --refresh --noconfirm ripgrep git curl screen vim base-devel cmake gdb dejagnu jdk25-openjdk jq jadx tor torsocks wine-staging clang lld sudo aria2 htop less nim wget unzip nmap jemalloc ninja nano
        
        echo 'james ALL=(ALL:ALL) NOPASSWD: ALL' | sudo docker exec --interactive archlinux tee '/etc/sudoers.d/james'
        sudo docker exec archlinux chmod 0440 '/etc/sudoers.d/james'
        sudo docker exec archlinux visudo --check --file '/etc/sudoers.d/james'
    - name: Install zsh
      run: |
        sudo docker exec archlinux pacman --sync --refresh --noconfirm zsh
        
        sudo docker exec --user james --workdir '/home/james' archlinux bash -c 'sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended'
        
        sudo docker exec archlinux usermod --shell '/bin/zsh' james
        
        sudo docker exec archlinux rm --force '/etc/zsh/zshrc'
        
        sudo docker exec --user james --workdir '/home/james' archlinux bash -c 'echo "path+=${HOME}/.opencode/bin" >> ~/.zshrc'
        sudo docker exec --user james --workdir '/home/james' archlinux bash -c 'echo "path+=${HOME}/.local/bin" >> ~/.zshrc'
    - name: Change global settings
      run: |
        echo 'defscrollback 1000000' | sudo docker exec --interactive archlinux tee --append '/etc/screenrc'
        echo 'VISUAL=vim' | sudo docker exec --interactive archlinux tee --append '/etc/environment'
        echo 'EDITOR=vim' | sudo docker exec --interactive archlinux tee --append '/etc/environment'
        echo 'LC_ALL=C.UTF-8' | sudo docker exec --interactive archlinux tee --append '/etc/environment'
        echo 'ZSH_DISABLE_COMPFIX=true' | sudo docker exec --interactive archlinux tee --append '/etc/environment'
        echo 'LD_PRELOAD=/usr/lib/libjemalloc.so' | sudo docker exec --interactive archlinux tee --append '/etc/environment'
        echo 'NODE_TLS_REJECT_UNAUTHORIZED=0' | sudo docker exec --interactive archlinux tee --append '/etc/environment'
        
        sudo docker exec archlinux rm --force '/etc/motd'
    - name: Install OpenCode
      run: |
        curl -fsSL https://opencode.ai/install | sudo docker exec --interactive --user james archlinux bash
        printf '%s\n' '${{ secrets.OPENCODE_CONFIG }}' | sudo docker exec --interactive --user james archlinux bash -c 'mkdir -p "$HOME/.config/opencode"; cat > "$HOME/.config/opencode/opencode.jsonc"'
        sudo docker cp "${PWD}/AGENTS.md" archlinux:/home/james/.config/opencode/AGENTS.md
        sudo docker exec archlinux chown james: '/home/james/.config/opencode/AGENTS.md'
    - name: Set git credentials
      run: |
        sudo docker exec archlinux pacman --sync --refresh --noconfirm github-cli
        
        printf '%s\n' '${{ secrets.GH_TOKEN }}' | sudo docker exec --interactive --user james archlinux gh auth login --with-token
        sudo docker exec --user james archlinux gh auth setup-git
        
        sudo docker exec --user james archlinux git config --global user.email "105828205+Kartatz@users.noreply.github.com"
        sudo docker exec --user james archlinux git config --global user.name "Kartatz"
        sudo docker exec --user james archlinux git config --global pull.rebase true
    - name: Start services
      run: |
        sudo docker exec archlinux systemctl start tor.service
    - name: Install Kad
      run: |
        sudo docker exec archlinux bash -c '
            declare -r KAD_TAG="v0.3"
            declare -r KAD_TARBALL="/tmp/kad.tar.xz"
            declare -r KAD_URL="https://github.com/AmanoTeam/Kad/releases/download/${KAD_TAG}/x86_64-unknown-linux-gnu.tar.xz"
            
            curl --connect-timeout "10" --retry "15" --retry-all-errors --fail --silent --location --url "${KAD_URL}" --output "${KAD_TARBALL}"
            tar --directory="$(dirname "${KAD_TARBALL}")" --extract --file="${KAD_TARBALL}"
        '
        
        sudo docker exec --detach archlinux /tmp/kad/bin/kad --host 0.0.0.0 --port=4000 --target=chrome160 --platform=windows --insecure # --proxy socks5://127.0.0.1:1080
    - name: Install WARP SOCKS5
      run: |
        sudo docker cp "${PWD}/wgcf-socks" archlinux:/opt/wgcf-socks
        
        sudo docker exec archlinux bash '/opt/wgcf-socks/install.sh' || {
            rc=$?
            
            sudo docker exec archlinux bash -c '
                systemctl status wgcf-netns.service wgcf-warp.service wgcf-socks5.service wgcf-socks5-bridge.service --no-pager --full || true
                
                journalctl --no-pager --no-hostname -u wgcf-netns.service -u wgcf-warp.service -u wgcf-socks5.service -u wgcf-socks5-bridge.service || true
                
                ip netns list || true
                ip addr show || true
                ip route show || true
                ip -n wgcf addr show 2>/dev/null || true
                ip -n wgcf route show 2>/dev/null || true
                
                ss -tlnp || true
                
                wg show 2>/dev/null || true
                
                cat /etc/wireguard/wgcf.conf 2>/dev/null || true
                
                iptables-save 2>/dev/null || true
            ' || true
            
            exit "${rc}"
        }
    - name: Free up some space
      run: |
        dpkg-query -W -f '${Package}\n' | grep -E '^(docker|containerd)' | xargs -r sudo apt-mark manual
        ( curl 'https://raw.githubusercontent.com/AmanoTeam/gha-free-space/refs/heads/master/main.sh' -sSf | sed -E '/(docker|container)/d' | bash && sudo rm -rf '/usr/share' '/usr/src' ) &
    - name: Scrape and backup
      run: |
        declare code
        
        for attempt in 1 2 3; do
            code="$(sudo docker exec archlinux curl --silent --show-error --insecure --max-time 15 --proxy 'http://127.0.0.1:4000' --output /dev/null --write-out '%{http_code}' 'https://pje.cloud.tjpe.jus.br/' || true)"
            
            echo "probe attempt ${attempt}: http_code=${code}"
            
            [[ "${code}" =~ ^[1-5][0-9][0-9]$ ]] && break
            
            sudo docker exec archlinux ss --tcp --listening --numeric --processes || true
            sudo docker exec archlinux pgrep --list-full kad || true
            
            sudo docker exec archlinux pkill kad || true
            sleep 5
            sudo docker exec --detach archlinux /tmp/kad/bin/kad --host 0.0.0.0 --port=4000 --target=chrome160 --platform=windows --insecure
            sleep 15
        done
        
        [[ "${code}" =~ ^[1-5][0-9][0-9]$ ]]
        
        sudo docker exec --user james archlinux pip install --break-system-packages aiofiles httpx pypdfium2
        
        sudo docker exec --user james --workdir '/home/james' archlinux gh repo clone 'Kartatz/pje-gather' -- --depth 1 || true
        
        sudo docker exec --user james archlinux mkdir --parents '/home/james/pje_enum'
        
        sudo docker exec --user james archlinux gh release download 'mapping-snapshot-1M' --repo 'Kartatz/pje-gather' --dir '/home/james/pje_enum' --clobber
        
        sudo docker exec --user james archlinux sh -c 'if [ -f "/home/james/pje_enum/mapping_snapshot.json" ]; then mv "/home/james/pje_enum/mapping_snapshot.json" "/home/james/pje_enum/mapping.json"; fi'
        
        declare base=0
        
        if sudo docker exec --user james archlinux test -f '/home/james/pje_enum/mapping.json'; then
            base="$(sudo docker exec --user james archlinux sh -c 'wc --lines < /home/james/pje_enum/mapping.json')"
        fi
        
        declare budget=$(( DEADLINE - $(date +%s) - 900 ))
        
        (( budget >= 600 )) || budget=600
        
        sudo docker exec --interactive --user james archlinux timeout --signal='TERM' "${budget}" python3 -u '/home/james/pje-gather/pje_gather.py' --end 160000000 --concurrency 256 --mapping --out '/home/james/pje_enum' || true
        
        declare delta="mapping_delta_$(date --utc '+%Y%m%dT%H%M%SZ').jsonl"
        
        sudo docker exec --interactive --user james --workdir '/home/james/pje_enum' archlinux python3 - "${base}" "${delta}" <<'PY'
        import json
        import os
        import sys
        
        base = int(sys.argv[1])
        delta = sys.argv[2]
        count = 0
        
        if not os.path.exists('mapping.json'):
            open('mapping.json', 'w').close()
        
        with open('mapping.json', 'rb') as source, open('mapping_snapshot.json', 'w') as full, open(delta, 'w') as extra:
            for line in source:
                try:
                    entry = json.loads(line)
                except Exception:
                    continue
                
                record = json.dumps(entry) + '\n'
                
                full.write(record)
                
                if count >= base:
                    extra.write(record)
                
                count += 1
        
        print('records=%d new=%d' % (count, count - base))
        PY
        
        sudo docker exec --interactive --user james --workdir '/home/james/pje_enum' archlinux bash -s -- "${delta}" <<'SH'
        set -e
        
        delta="$1"
        upload=''
        
        if [ -f 'mapping_snapshot.json' ] && [ "$(stat --format='%s' 'mapping_snapshot.json')" -le 1900000000 ]; then
            upload='mapping_snapshot.json'
        fi
        
        if [ -f 'last_id.txt' ]; then upload="${upload} last_id.txt"; fi
        if [ -f 'done.txt' ]; then upload="${upload} done.txt"; fi
        if [ -f "${delta}" ]; then upload="${upload} ${delta}"; fi
        
        if [ -n "${upload}" ]; then
            gh release upload 'mapping-snapshot-1M' ${upload} --clobber --repo 'Kartatz/pje-gather'
        fi
        SH
    - name: Dispatch next run
      if: ${{ !cancelled() }}
      run: sudo docker exec --user james archlinux gh workflow run build.yml --ref scraper --repo Kartatz/r
